services:
  - type: web
    name: liteping-api-engine
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: PROJECT_NAME
        value: "LitePing Production Engine"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SECRET_KEY
        generateValue: true # Render automatically provisions an immutable secure random cryptographic key string
      - key: REDIS_URL
        sync: false         # Paste your serverless Upstash token string into the dashboard variable UI panel
      - key: DATABASE_URL
        fromDatabase:
          name: liteping-db
          property: connectionString

databases:
  - name: liteping-db
    plan: free
    region: singapore
    postgresMajorVersion: "15"
